name: 🤖 Android Builds
on:
  workflow_dispatch:

permissions:
  contents: write

# Global Settings
env:
  SCONS_FLAGS: >-
    module_text_server_fb_enabled=yes

jobs:
  build-android:
    runs-on: ubuntu-26.04
    name: ${{ matrix.name }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor arm64 (target=editor)
            cache-name: android-editor
            target: editor
            scons-flags: >-
              arch=arm64
              production=yes
              -j4

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Restore Gradle cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle|${{ hashFiles('platform/android/java/**/*.gradle*', 'platform/android/java/gradle.properties') }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy
        shell: sh
        id: swappy_sdk
        run: |
          if python ./misc/scripts/install_swappy_android.py; then
            echo "SWAPPY_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Swappy installation failed, building without Swappy support."
            echo "SWAPPY_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Perfetto
        shell: sh
        id: perfetto_sdk
        run: |
          if python ./misc/scripts/install_perfetto.py; then
            echo "PROFILER_ENABLED=perfetto" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Perfetto installation failed, building without Perfetto support."
            echo "PROFILER_ENABLED=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} profiler=${{ steps.perfetto_sdk.outputs.PROFILER_ENABLED }} swappy=${{ steps.swappy_sdk.outputs.SWAPPY_ENABLED }}
          platform: android
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        if: always()
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Save Gradle cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle|${{ hashFiles('platform/android/java/**/*.gradle*', 'platform/android/java/gradle.properties') }}
        continue-on-error: true

      - name: Generate Godot editor
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..
          ls -l bin/android_editor_builds/

      - name: Release APK (per-build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l bin/android_editor_builds/
          TAG="mcp-editor-$(date +%Y%m%d-%H%M)-${GITHUB_SHA:0:7}"
          gh release create "$TAG" bin/android_editor_builds/*.apk \
            --title "Godot 4.8-dev Editor arm64 (MCP) $TAG" \
            --notes "Download APK langsung (bukan zip). Setelah editor terbuka, aktifkan MCP di Editor > Editor Settings > mcp. URL LAN tampil di notifikasi 'Server MCP hidup' (pilih 'Salin URL MCP')."
          APK=$(ls bin/android_editor_builds/*.apk | head -1)
          APKNAME=$(basename "$APK")
          echo "### APK editor arm64 (download langsung)" >> "$GITHUB_STEP_SUMMARY"
          echo "[$APKNAME](https://github.com/${{ github.repository }}/releases/download/$TAG/$APKNAME)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}
          path: bin/android_editor_builds/

  build-android-templates:
    runs-on: ubuntu-26.04
    name: Android export templates (arm64)
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: android-templates
        continue-on-error: true

      - name: Restore Gradle cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-templates|${{ hashFiles('platform/android/java/**/*.gradle*', 'platform/android/java/gradle.properties') }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Build template_debug (arm64)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 production=yes -j4
          platform: android
          target: template_debug

      - name: Build template_release (arm64)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 production=yes -j4
          platform: android
          target: template_release

      - name: Save Godot build cache
        if: always()
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: android-templates
        continue-on-error: true

      - name: Generate Android export templates
        run: |
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd ../../..
          ls -l bin/android_debug.apk bin/android_release.apk bin/android_source.zip

      - name: Package custom export templates
        run: |
          VERSION=$(python3 - <<'PY'
          import runpy
          v = runpy.run_path("version.py")
          number = f"{v['major']}.{v['minor']}"
          if v["patch"]:
              number += f".{v['patch']}"
          print(f"{number}.{v['status']}{v.get('module_config', '')}")
          PY
          )
          mkdir -p bin/android_templates
          cp bin/android_debug.apk bin/android_release.apk bin/android_source.zip bin/android_templates/
          echo "$VERSION" > bin/android_templates/version.txt
          cd bin/android_templates
          zip -r ../custom_android_export_templates.zip .
          echo "Template version: $VERSION"

      - name: Release export templates (per-build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mcp-templates-$(date +%Y%m%d-%H%M)-${GITHUB_SHA:0:7}"
          gh release create "$TAG" bin/custom_android_export_templates.zip \
            --title "Godot 4.8-dev Android export templates (MCP) $TAG" \
            --notes "Custom Android export templates arm64. Install via Editor > Manage Export Templates > Install from File. Pakai ini agar animasi splash dan opsi launcher splash ikut ke APK game."
          echo "### Android export templates" >> "$GITHUB_STEP_SUMMARY"
          echo "[custom_android_export_templates.zip](https://github.com/${{ github.repository }}/releases/download/$TAG/custom_android_export_templates.zip)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: android-templates
          path: bin/custom_android_export_templates.zip
