name: 🤖 Android Builds
on:
  workflow_dispatch:

permissions:
  contents: write

# Global Settings
env:
  SCONS_FLAGS: >-
    module_text_server_fb_enabled=yes

jobs:
  build-android:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor arm64 (target=editor)
            cache-name: android-editor
            target: editor
            scons-flags: >-
              arch=arm64
              production=yes
              -j4

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Restore Gradle cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle|${{ hashFiles('platform/android/java/**/*.gradle*', 'platform/android/java/gradle.properties') }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy
        shell: sh
        id: swappy_sdk
        run: |
          if python ./misc/scripts/install_swappy_android.py; then
            echo "SWAPPY_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Swappy installation failed, building without Swappy support."
            echo "SWAPPY_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Perfetto
        shell: sh
        id: perfetto_sdk
        run: |
          if python ./misc/scripts/install_perfetto.py; then
            echo "PROFILER_ENABLED=perfetto" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Perfetto installation failed, building without Perfetto support."
            echo "PROFILER_ENABLED=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} profiler=${{ steps.perfetto_sdk.outputs.PROFILER_ENABLED }} swappy=${{ steps.swappy_sdk.outputs.SWAPPY_ENABLED }}
          platform: android
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        if: always()
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Save Gradle cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle|${{ hashFiles('platform/android/java/**/*.gradle*', 'platform/android/java/gradle.properties') }}
        continue-on-error: true

      - name: Generate Godot editor
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..
          ls -l bin/android_editor_builds/

      - name: Release APK (per-build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l bin/android_editor_builds/
          TAG="mcp-editor-$(date +%Y%m%d-%H%M)-${GITHUB_SHA:0:7}"
          gh release create "$TAG" bin/android_editor_builds/*.apk \
            --title "Godot 4.8-dev Editor arm64 (MCP) $TAG" \
            --notes "Download APK langsung (bukan zip). Setelah editor terbuka, aktifkan MCP di Editor > Editor Settings > mcp. URL LAN tampil di notifikasi 'Server MCP hidup' (pilih 'Salin URL MCP')."
          APK=$(ls bin/android_editor_builds/*.apk | head -1)
          echo "### APK editor arm64 (download langsung)" >> "$GITHUB_STEP_SUMMARY"
          echo "[$APK](https://github.com/${{ github.repository }}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}
          path: bin/android_editor_builds/